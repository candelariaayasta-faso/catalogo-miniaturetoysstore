<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miniature Toys Store</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    overflow-x: hidden;
}

/* ===== ENCABEZADO ===== */

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 28px 15px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    font-size: 14px;
}

/* ===== CATEGORÍAS ===== */

.categorias {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 15px 10px;
    background: white;
}

.categoria {
    display: block;
    text-decoration: none;
    color: #111;
    background: #eeeeee;
    padding: 10px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

/* ===== BIENVENIDA ===== */

.bienvenida {
    text-align: center;
    padding: 22px 15px;
    background: white;
}

.bienvenida h2 {
    margin: 0 0 8px;
    font-size: 23px;
}

.bienvenida p {
    margin: 0;
    font-size: 14px;
    line-height: 1.4;
}

/* ===== SECCIONES ===== */

.productos {
    width: calc(100% - 20px);
    margin: 15px auto;
    padding: 20px 10px;
    background: white;
    border-radius: 18px;
}

.productos h2 {
    text-align: center;
    font-size: 23px;
    margin: 0 0 18px;
}
